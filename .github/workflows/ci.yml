name: CI

on:
  push:
    branches: [main, 'arena/**', 'develop']
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    name: Qualité (lint, types, tests, build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fmhm
          POSTGRES_PASSWORD: fmhm_ci_only
          POSTGRES_DB: fmhm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmhm -d fmhm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fmhm:fmhm_ci_only@localhost:5432/fmhm_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Valider le schéma Prisma
        run: npx prisma validate

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests automatisés
        run: npm test

      - name: Vérifier la connexion et le schéma
        run: npm run db:check

      - name: Build de production
        run: npm run build
